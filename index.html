<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Wizard's Bouncing Cauldron</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #ffffff;
            font-family: 'Comic Sans MS', 'Bubblegum Sans', 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 750px;
            background: linear-gradient(to bottom, #311042, #1e1b4b, #0f172a);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 4px solid #a855f7;
        }

        /* Top Header UI */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(168, 85, 247, 0.2);
            backdrop-filter: blur(5px);
            border-bottom: 2px dashed rgba(168, 85, 247, 0.4);
            z-index: 10;
        }

        .hud-box {
            background: #3b0764;
            color: #f3e8ff;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid #c084fc;
            box-shadow: 0 4px 0 #581c87;
        }

        /* Word Target Banner */
        .target-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            z-index: 10;
        }

        .hint-text {
            font-size: 1rem;
            color: #e9d5ff;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(88, 28, 135, 0.6);
            padding: 6px 16px;
            border-radius: 12px;
            border: 1px solid #c084fc;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .word-display {
            display: flex;
            gap: 10px;
        }

        .letter-slot {
            width: 50px;
            height: 55px;
            background: rgba(30, 27, 75, 0.8);
            border: 3px solid #c084fc;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: #6b21a8;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .letter-slot.filled {
            color: #4ade80;
            border-color: #22c55e;
            background: #052e16;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.5);
        }

        /* Play Area / Interactive Physics Box */
        #play-area {
            position: relative;
            flex-grow: 1;
            overflow: hidden;
            z-index: 5;
        }

        /* Bouncing Interactive Letter Orbs */
        .orb {
            position: absolute;
            width: 65px;
            height: 65px;
            background: radial-gradient(circle at 30% 30%, #e879f9, #7e22ce);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            box-shadow: inset -5px -5px 12px rgba(0,0,0,0.4), 0 8px 20px rgba(168,85,247,0.5);
            cursor: pointer;
            user-select: none;
            border: 2px solid #f0abfc;
            transform: translate(-50%, -50%);
            transition: transform 0.1s;
        }

        .orb:active {
            transform: translate(-50%, -50%) scale(0.85);
        }

        /* Magic Cauldron Graphic at the bottom */
        .cauldron-base {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: linear-gradient(to top, #18181b, #27272a);
            border-top: 4px solid #a855f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #d8b4fe;
            z-index: 8;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.5);
        }

        /* Success Popup Modal */
        #success-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: #1e1b4b;
            border: 6px solid #c084fc;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            z-index: 20;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 85%;
            max-width: 350px;
        }

        #success-modal.show {
            transform: translate(-50%, -50%) scale(1);
        }

        #success-modal h2 {
            color: #4ade80;
            margin: 0 0 10px 0;
            font-size: 2.2rem;
        }

        .action-btn {
            background: #9333ea;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 6px 0 #581c87;
            font-family: inherit;
            margin-top: 15px;
            transition: 0.1s;
            border: 2px solid #c084fc;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #581c87;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <!-- UI Information panel -->
        <div class="hud">
            <div class="hud-box">✨ Magic Points: <span id="score">0</span></div>
            <div class="hud-box" id="word-category">Animals</div>
        </div>

        <!-- Target word mapping interface -->
        <div class="target-section">
            <div class="hint-text" id="hint-label">Brew the word: CAT</div>
            <div class="word-display" id="word-slots"></div>
        </div>

        <!-- Interactive Physics Play Area for Bouncing Letters -->
        <div id="play-area"></div>

        <!-- Cauldron Footer -->
        <div class="cauldron-base">🔮 Tap the bouncing orbs in order! 🔮</div>

        <!-- Success Popup Modal -->
        <div id="success-modal">
            <div style="font-size: 4rem; margin-bottom: 5px;" id="modal-emoji">🐱</div>
            <h2 id="modal-title">Spell Brewed!</h2>
            <p id="modal-desc" style="color: #e9d5ff; font-size: 1.1rem; margin: 0;">You successfully brewed CAT!</p>
            <button class="action-btn" onclick="nextWord()">NEXT SPELL 🚀</button>
        </div>
    </div>

    <script>
        const playArea = document.getElementById('play-area');
        const wordSlotsEl = document.getElementById('word-slots');
        const hintLabel = document.getElementById('hint-label');
        const scoreEl = document.getElementById('score');
        const successModal = document.getElementById('success-modal');
        const modalEmoji = document.getElementById('modal-emoji');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');

        const wordList = [
            { word: "DOG", hint: "A friendly barking animal", emoji: "🐶", category: "Animals" },
            { word: "CAT", hint: "A furry pet that meows", emoji: "🐱", category: "Animals" },
            { word: "STAR", hint: "Twinkles high up at night", emoji: "⭐", category: "Nature" },
            { word: "MOON", hint: "Shines in the dark night sky", emoji: "🌙", category: "Nature" },
            { word: "BOOK", hint: "Full of exciting stories", emoji: "📖", category: "School" },
            { word: "FROG", hint: "Green hopper near the pond", emoji: "🐸", category: "Animals" },
            { word: "TREE", hint: "Tall plant with green leaves", emoji: "🌳", category: "Nature" }
        ];

        let currentWordObj = null;
        let currentLetterIndex = 0;
        let score = 0;
        let orbs = [];
        let animationFrameId = null;

        // Sound synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'tap') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampYToValueAtTime ? osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1) : osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.12);
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.24);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(90, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                }
            } catch(e) {}
        }

        function loadNewWord() {
            successModal.classList.remove('show');
            currentWordObj = wordList[Math.floor(Math.random() * wordList.length)];
            currentLetterIndex = 0;
            
            hintLabel.innerText = `${currentWordObj.category}: ${currentWordObj.hint}`;
            
            wordSlotsEl.innerHTML = '';
            for (let i = 0; i < currentWordObj.word.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'letter-slot';
                slot.innerText = '_';
                wordSlotsEl.appendChild(slot);
            }

            spawnOrbs();
        }

        function spawnOrbs() {
            playArea.innerHTML = '';
            orbs = [];

            const targetChar = currentWordObj.word[currentLetterIndex];
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            
            let letters = [targetChar];
            while(letters.length < 4) {
                let randChar = alphabet[Math.floor(Math.random() * alphabet.length)];
                if(!letters.includes(randChar)) letters.push(randChar);
            }
            letters.sort(() => Math.random() - 0.5);

            const rect = playArea.getBoundingClientRect();
            const width = rect.width || 400;
            const height = rect.height || 350;

            letters.forEach((char) => {
                const el = document.createElement('div');
                el.className = 'orb';
                el.innerText = char;

                let orbData = {
                    element: el,
                    char: char,
                    x: Math.random() * (width - 100) + 50,
                    y: Math.random() * (height - 150) + 50,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    radius: 325
                };

                el.onclick = () => handleOrbTap(orbData);
                playArea.appendChild(el);
                orbs.push(orbData);
            });

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            physicsLoop();
        }

        // Real-time bouncing physics engine loop for maximum interactivity
        function physicsLoop() {
            const rect = playArea.getBoundingClientRect();
            const width = rect.width || 400;
            const height = rect.height || 350;

            orbs.forEach(orb => {
                orb.x += orb.vx;
                orb.y += orb.vy;

                // Wall boundary checks with bounce
                if (orb.x < 35 || orb.x > width - 35) {
                    orb.vx *= -1;
                    orb.x = Math.max(35, Math.min(width - 35, orb.x));
                }
                if (orb.y < 35 || orb.y > height - 60) {
                    orb.vy *= -1;
                    orb.y = Math.max(35, Math.min(height - 60, orb.y));
                }

                orb.element.style.left = orb.x + 'px';
                orb.element.style.top = orb.y + 'px';
            });

            animationFrameId = requestAnimationFrame(physicsLoop);
        }

        function handleOrbTap(orbData) {
            const expectedChar = currentWordObj.word[currentLetterIndex];

            if (orbData.char === expectedChar) {
                playSound('tap');
                
                // Remove tapped orb from physics array and DOM
                orbs = orbs.filter(o => o !== orbData);
                orbData.element.remove();

                const slots = wordSlotsEl.children;
                slots[currentLetterIndex].innerText = orbData.char;
                slots[currentLetterIndex].classList.add('filled');

                currentLetterIndex++;

                if (currentLetterIndex >= currentWordObj.word.length) {
                    cancelAnimationFrame(animationFrameId);
                    score += 15;
                    scoreEl.innerText = score;
                    playSound('win');
                    showSuccessPopup();
                } else {
                    // Respawn remaining/new bouncing letters dynamically
                    spawnRemainingOrbs();
                }
            } else {
                playSound('error');
                orbData.element.style.transform = 'translate(-50%, -50%) scale(0.7)';
                setTimeout(() => {
                    orbData.element.style.transform = 'translate(-50%, -50%) scale(1)';
                }, 150);
            }
        }

        function spawnRemainingOrbs() {
            const targetChar = currentWordObj.word[currentLetterIndex];
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            
            let letters = [targetChar];
            while(letters.length < 3) {
                let randChar = alphabet[Math.floor(Math.random() * alphabet.length)];
                if(!letters.includes(randChar) && !currentWordObj.word.includes(randChar)) {
                    letters.push(randChar);
                }
            }
            letters.sort(() => Math.random() - 0.5);

            // Clear old orbs and spawn new batch for the next letter
            playArea.innerHTML = '';
            orbs = [];

            const rect = playArea.getBoundingClientRect();
            const width = rect.width || 400;
            const height = rect.height || 350;

            letters.forEach((char) => {
                const el = document.createElement('div');
                el.className = 'orb';
                el.innerText = char;

                let orbData = {
                    element: el,
                    char: char,
                    x: Math.random() * (width - 100) + 50,
                    y: Math.random() * (height - 150) + 50,
                    vx: (Math.random() - 0.5) * 4.5,
                    vy: (Math.random() - 0.5) * 4.5
                };

                el.onclick = () => handleOrbTap(orbData);
                playArea.appendChild(el);
                orbs.push(orbData);
            });
        }

        function showSuccessPopup() {
            modalEmoji.innerText = currentWordObj.emoji;
            modalTitle.innerText = "Magical!";
            modalDesc.innerText = `You successfully brewed ${currentWordObj.word}!`;
            successModal.classList.add('show');
        }

        function nextWord() {
            loadNewWord();
        }

        loadNewWord();
    </script>
</body>
</html>

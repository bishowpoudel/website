<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Pocket Arcade</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: #09090b;
            color: #fafafa;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 15px;
            width: 100%;
            background: #18181b;
            border-bottom: 2px solid #27272a;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #f43f5e;
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
            letter-spacing: 2px;
        }

        /* Menu Hub Screen */
        #menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            flex-grow: 1;
        }

        .game-card {
            background: #18181b;
            border: 2px solid #3f3f46;
            border-radius: 12px;
            padding: 20px;
            margin: 10px 0;
            width: 100%;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .game-card:active {
            transform: scale(0.97);
            background: #27272a;
        }

        .game-card h3 {
            margin: 0 0 8px 0;
            color: #38bdf8;
            font-size: 1.2rem;
        }

        .game-card p {
            margin: 0;
            font-size: 0.85rem;
            color: #a1a1aa;
        }

        /* Active Game Wrapper */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 450px;
            padding: 15px;
            flex-grow: 1;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 15px;
            font-size: 1rem;
            font-weight: bold;
        }

        .back-btn {
            background: #3f3f46;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        /* Canvas and Play areas */
        canvas {
            background: #121214;
            border: 3px solid #52525b;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            touch-action: none;
            max-width: 100%;
        }

        /* Mobile Controls */
        .controls-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            width: 100%;
        }

        .ctrl-btn {
            background: #27272a;
            color: white;
            border: 2px solid #52525b;
            padding: 18px 24px;
            font-size: 1.2rem;
            border-radius: 12px;
            flex-grow: 1;
            font-family: inherit;
            font-weight: bold;
            touch-action: manipulation;
            box-shadow: 0 4px #18181b;
        }

        .ctrl-btn:active {
            background: #3f3f46;
            transform: translateY(3px);
            box-shadow: 0 1px #18181b;
        }

        /* Game Over Overlays inside the containers */
        .overlay-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(9, 9, 11, 0.9);
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #f43f5e;
            text-align: center;
            display: none;
            z-index: 10;
            width: 80%;
        }

        .container-box {
            position: relative;
        }
    </style>
</head>
<body>

    <header>
        <h1>👾 POCKET ARCADE</h1>
    </header>

    <!-- MENU HUB -->
    <div id="menu-screen">
        <p style="color: #a1a1aa; margin-bottom: 20px; font-size: 0.9rem;">Choose a game to play:</p>
        
        <div class="game-card" onclick="startApp(1)">
            <h3>🚀 Neon Dodger</h3>
            <p>Dodge falling cosmic space obstacles!</p>
        </div>

        <div class="game-card" onclick="startApp(2)">
            <h3>🐸 Lilypad Hop</h3>
            <p>Tap left/right to jump up moving logs safely.</p>
        </div>

        <div class="game-card" onclick="startApp(3)">
            <h3>💡 Tap-A-Flash</h3>
            <p>Test your speed on glowing grid squares.</p>
        </div>
    </div>

    <!-- GAMEPLAY VIEWCONTAINER -->
    <div id="game-screen">
        <div class="game-header">
            <button class="back-btn" onclick="returnToMenu()">⬅ MENU</button>
            <div>SCORE: <span id="live-score">0</span></div>
        </div>

        <div class="container-box" id="canvas-wrapper">
            <canvas id="gameCanvas" width="360" height="400"></canvas>
            <div id="game-over-box" class="overlay-msg">
                <h2 style="color: #f43f5e; margin-top:0;">GAME OVER</h2>
                <p id="final-score-text" style="font-size: 0.9rem; margin-bottom: 15px;">Score: 0</p>
                <button class="back-btn" style="background:#f43f5e; width:100%; padding: 12px;" onclick="restartActiveGame()">PLAY AGAIN</button>
            </div>
        </div>

        <!-- Dynamic Controls Container -->
        <div id="controls-container" class="controls-row"></div>
    </div>

    <script>
        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('live-score');
        const gameOverBox = document.getElementById('game-over-box');
        const finalScoreText = document.getElementById('final-score-text');
        const controlsContainer = document.getElementById('controls-container');

        let activeGameId = null;
        let score = 0;
        let isGameOver = false;
        let gameLoopId = null;
        let gameData = {};

        // Audio Generator via Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, duration, type='sine') {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function startApp(id) {
            activeGameId = id;
            menuScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            gameOverBox.style.display = 'none';
            score = 0;
            scoreEl.innerText = score;
            isGameOver = false;

            initGame();
        }

        function returnToMenu() {
            cancelAnimationFrame(gameLoopId);
            gameScreen.style.display = 'none';
            menuScreen.style.display = 'flex';
            activeGameId = null;
        }

        function triggerGameOver() {
            isGameOver = true;
            cancelAnimationFrame(gameLoopId);
            finalScoreText.innerText = `Final Score: ${score}`;
            gameOverBox.style.display = 'block';
            playTone(120, 0.3, 'sawtooth');
        }

        function restartActiveGame() {
            gameOverBox.style.display = 'none';
            score = 0;
            scoreEl.innerText = score;
            isGameOver = false;
            initGame();
        }

        // ==========================================
        // ROUTER / GAME DISPATCHER
        // ==========================================
        function initGame() {
            controlsContainer.innerHTML = '';
            if (activeGameId === 1) initNeonDodger();
            if (activeGameId === 2) initLilypadHop();
            if (activeGameId === 3) initTapFlash();
        }

        function runLoop() {
            if (isGameOver) return;
            if (activeGameId === 1) updateNeonDodger();
            if (activeGameId === 2) updateLilypadHop();
            // TapFlash uses interactive interval events instead of core canvas loops
            if (activeGameId !== 3) {
                gameLoopId = requestAnimationFrame(runLoop);
            }
        }

        // ==========================================
        // GAME 1: NEON DODGER (Space Side-Stepper)
        // ==========================================
        function initNeonDodger() {
            gameData = {
                playerX: 160,
                obstacles: [],
                speedMultiplier: 1
            };

            // Touch / Keyboard layout controls
            controlsContainer.innerHTML = `
                <button class="ctrl-btn" id="left-btn">◀ LEFT</button>
                <button class="ctrl-btn" id="right-btn">RIGHT ▶</button>
            `;

            const moveLeft = () => { if(!isGameOver) gameData.playerX = Math.max(20, gameData.playerX - 40); };
            const moveRight = () => { if(!isGameOver) gameData.playerX = Math.min(340, gameData.playerX + 40); };

            document.getElementById('left-btn').onclick = moveLeft;
            document.getElementById('right-btn').onclick = moveRight;
            
            // Allow keyboard arrows too
            window.onkeydown = (e) => {
                if (activeGameId === 1) {
                    if (e.key === 'ArrowLeft') moveLeft();
                    if (e.key === 'ArrowRight') moveRight();
                }
            };

            runLoop();
        }

        function updateNeonDodger() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Spawn obstacles
            if (Math.random() < 0.04) {
                gameData.obstacles.push({
                    x: Math.floor(Math.random() * 7) * 45 + 20,
                    y: -20,
                    size: 25
                });
            }

            // Update & Draw obstacles
            ctx.fillStyle = '#f43f5e';
            for (let i = gameData.obstacles.length - 1; i >= 0; i--) {
                let obs = gameData.obstacles[i];
                obs.y += 3.5 + (score * 0.05);

                ctx.fillRect(obs.x - obs.size/2, obs.y, obs.size, obs.size);

                // Collision detection
                let pBox = { x: gameData.playerX, y: 350, size: 25 };
                if (obs.x < pBox.x + pBox.size && obs.x + obs.size > pBox.x &&
                    obs.y < pBox.y + pBox.size && obs.y + obs.size > pBox.y) {
                    triggerGameOver();
                    return;
                }

                // Remove off-screen & add score
                if (obs.y > 420) {
                    gameData.obstacles.splice(i, 1);
                    score += 1;
                    scoreEl.innerText = score;
                    playTone(600, 0.05);
                }
            }

            // Draw Player Ship
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(gameData.playerX - 12, 350, 25, 25);

            gameLoopId = requestAnimationFrame(runLoop);
        }

        // ==========================================
        // GAME 2: LILYPAD HOP (Vertical climber)
        // ==========================================
        function initLilypadHop() {
            gameData = {
                player: { x: 180, y: 320, radius: 10 },
                platforms: [
                    { x: 150, y: 350, w: 60, h: 12 },
                    { x: 100, y: 260, w: 60, h: 12, dir: 1 },
                    { x: 200, y: 170, w: 60, h: 12, dir: -1 },
                    { x: 130, y: 80, w: 60, h: 12, dir: 1 }
                ]
            };

            controlsContainer.innerHTML = `
                <button class="ctrl-btn" id="hop-btn">⚡ JOP / SWITCH SIDE</button>
            `;

            const hopAction = () => {
                if (isGameOver) return;
                gameData.player.x = gameData.player.x > 180 ? 120 : 240;
                playTone(450, 0.08);
            };

            document.getElementById('hop-btn').onclick = hopAction;
            window.onkeydown = (e) => { if (activeGameId === 2 && e.key === ' ') hopAction(); };

            runLoop();
        }

        function updateLilypadHop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Move platforms sideways
            gameData.platforms.forEach(p => {
                if (p.dir) {
                    p.x += p.dir * 1.8;
                    if (p.x < 10 || p.x + p.w > 350) p.dir *= -1;
                }
            });

            // Draw Platforms
            ctx.fillStyle = '#22c55e';
            gameData.platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.w, p.h);
            });

            // Scroll world down automatically
            gameData.platforms.forEach(p => {
                p.y += 1.2;
            });

            // Respawn platforms at bottom if they go off screen
            gameData.platforms.forEach(p => {
                if (p.y > 400) {
                    p.y = -20;
                    p.x = Math.random() * 250 + 20;
                    score += 2;
                    scoreEl.innerText = score;
                }
            });

            // Simple vertical follow for player
            gameData.player.y = 220;

            // Check if player misses platforms (falls off screen bottom)
            let onPlatform = gameData.platforms.some(p => 
                gameData.player.x >= p.x && gameData.player.x <= p.x + p.w &&
                gameData.player.y + 10 >= p.y && gameData.player.y <= p.y + p.h
            );

            // Draw Frog / Player
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.arc(gameData.player.x, gameData.player.y, gameData.player.radius, 0, Math.PI * 2);
            ctx.fill();

            gameLoopId = requestAnimationFrame(runLoop);
        }

        // ==========================================
        // GAME 3: TAP-A-FLASH (Reaction / Memory)
        // ==========================================
        function initTapFlash() {
            gameData = {
                activeIdx: -1,
                timerId: null
            };

            // Setup a 2x2 grid pad interface inside controls/canvas container
            controlsContainer.innerHTML = `
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%;">
                    <button class="ctrl-btn flash-pad" data-id="0" style="background:#18181b; height:70px;">1</button>
                    <button class="ctrl-btn flash-pad" data-id="1" style="background:#18181b; height:70px;">2</button>
                    <button class="ctrl-btn flash-pad" data-id="2" style="background:#18181b; height:70px;">3</button>
                    <button class="ctrl-btn flash-pad" data-id="3" style="background:#18181b; height:70px;">4</button>
                </div>
            `;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#a1a1aa';
            ctx.font = '16px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText("Tap the flashing pads quickly!", canvas.width / 2, canvas.height / 2);

            const pads = document.querySelectorAll('.flash-pad');
            pads.forEach(pad => {
                pad.onclick = (e) => {
                    if (isGameOver) return;
                    let id = parseInt(e.target.getAttribute('data-id'));
                    if (id === gameData.activeIdx) {
                        score += 10;
                        scoreEl.innerText = score;
                        playTone(800, 0.1);
                        nextFlashRound();
                    } else {
                        triggerGameOver();
                    }
                };
            });

            nextFlashRound();
        }

        function nextFlashRound() {
            if (isGameOver) return;
            const pads = document.querySelectorAll('.flash-pad');
            pads.forEach(p => p.style.background = '#18181b');

            gameData.activeIdx = Math.floor(Math.random() * 4);
            pads[gameData.activeIdx].style.background = '#f43f5e';
            playTone(300, 0.05);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Forest: Magic Letter Catcher</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #1e1b4b, #312e81, #1e1b4b);
            color: #ffffff;
            font-family: 'Comic Sans MS', 'Bubblegum Sans', 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 750px;
            background: linear-gradient(to bottom, #38bdf8 0%, #bae6fd 60%, #4ade80 60%, #15803d 100%);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Header UI */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            border-bottom: 3px dashed rgba(255, 255, 255, 0.6);
            z-index: 10;
        }

        .hud-box {
            background: #ffffff;
            color: #1e293b;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 0 #cbd5e1;
        }

        /* Word Target Banner */
        .target-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            z-index: 10;
        }

        .hint-text {
            font-size: 0.95rem;
            color: #14532d;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.7);
            padding: 4px 12px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .word-display {
            display: flex;
            gap: 8px;
        }

        .letter-slot {
            width: 45px;
            height: 50px;
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #16a34a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #cbd5e1;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .letter-slot.filled {
            color: #16a34a;
            border-color: #15803d;
            background: #dcfce7;
            transform: scale(1.1);
        }

        /* Play Area / Canvas */
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Floating Interactive Bubbles Layer */
        #bubbles-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 8;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #60a5fa);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: #1e3a8a;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.2), 0 8px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            pointer-events: auto;
            transform: translate(-50%, -50%);
            animation: floatUp 4s linear infinite;
            transition: transform 0.1s;
        }

        .bubble:active {
            transform: translate(-50%, -50%) scale(0.8);
        }

        @keyframes floatUp {
            0% { transform: translate(-50%, 0) scale(0.8); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translate(-50%, -550px) scale(1.1); opacity: 0; }
        }

        /* Celebration overlay banner */
        #success-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: #ffffff;
            border: 6px solid #4ade80;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            z-index: 20;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #success-modal.show {
            transform: translate(-50%, -50%) scale(1);
        }

        #success-modal h2 {
            color: #15803d;
            margin: 0 0 10px 0;
            font-size: 2rem;
        }

        .action-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 6px 0 #14532d;
            font-family: inherit;
            margin-top: 15px;
            transition: 0.1s;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #14532d;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <!-- Canvas for visual background depth (Sun rays, trees, twinkling particles) -->
        <canvas id="gameCanvas"></canvas>

        <!-- UI Information panel -->
        <div class="hud">
            <div class="hud-box">⭐ Stars: <span id="score">0</span></div>
            <div class="hud-box" id="word-category">Animals</div>
        </div>

        <!-- Target word mapping interface -->
        <div class="target-section">
            <div class="hint-text" id="hint-label">Find the letters for: CAT</div>
            <div class="word-display" id="word-slots">
                <!-- Dynamically populated letter slot elements -->
            </div>
        </div>

        <!-- Layer for interactive bubbles -->
        <div id="bubbles-layer"></div>

        <!-- Success Popup Modal -->
        <div id="success-modal">
            <div style="font-size: 3.5rem; margin-bottom: 5px;" id="modal-emoji">🐱</div>
            <h2 id="modal-title">Awesome!</h2>
            <p id="modal-desc" style="color: #475569; font-size: 1.1rem; margin: 0;">You spelled CAT correctly!</p>
            <button class="action-btn" onclick="nextWord()">NEXT WORD 🚀</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bubblesLayer = document.getElementById('bubbles-layer');
        const wordSlotsEl = document.getElementById('word-slots');
        const hintLabel = document.getElementById('hint-label');
        const scoreEl = document.getElementById('score');
        const successModal = document.getElementById('success-modal');
        const modalEmoji = document.getElementById('modal-emoji');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');

        // Word Database structured for kids learning
        const wordList = [
            { word: "CAT", hint: "A furry pet that meows", emoji: "🐱", category: "Animals" },
            { word: "DOG", hint: "A friendly barking animal", emoji: "🐶", category: "Animals" },
            { word: "SUN", hint: "Bright yellow star in the sky", emoji: "☀️", category: "Nature" },
            { word: "STAR", hint: "Twinkles high up at night", emoji: "⭐", category: "Nature" },
            { word: "BOOK", hint: "Something you read for stories", emoji: "📖", category: "School" },
            { word: "TREE", hint: "Tall plant with green leaves", emoji: "🌳", category: "Nature" },
            { word: "FISH", hint: "Swims around in the water", emoji: "🐠", category: "Animals" },
            { word: "MOON", hint: "Shines bright in the dark night", emoji: "🌙", category: "Nature" }
        ];

        let currentWordObj = null;
        let currentLetterIndex = 0;
        let score = 0;
        let activeBubbles = [];
        let particles = [];

        // Simple Audio Synthesizer (No external assets required, crystal clean sound)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.35);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch(e) {}
        }

        // Resize Canvas to fit parent wrapper accurately
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Background visual particle generation (Fireflies / sparkles)
        for (let i = 0; i < 20; i++) {
            particles.push({
                x: Math.random() * 480,
                y: Math.random() * 750,
                radius: Math.random() * 3 + 1,
                speedY: (Math.random() * 0.5 + 0.2) * -1,
                opacity: Math.random()
            });
        }

        function drawBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw glowing background ambient particles
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            particles.forEach(p => {
                p.y += p.speedY;
                if (p.y < 0) p.y = canvas.height;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(Math.sin(Date.now() * 0.002 + p.x))})`;
                ctx.fill();
            });

            requestAnimationFrame(drawBackground);
        }
        drawBackground();

        function loadNewWord() {
            successModal.classList.remove('show');
            currentWordObj = wordList[Math.floor(Math.random() * wordList.length)];
            currentLetterIndex = 0;
            
            hintLabel.innerText = `${currentWordObj.category}: ${currentWordObj.hint}`;
            
            // Build letter slot elements
            wordSlotsEl.innerHTML = '';
            for (let i = 0; i < currentWordObj.word.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'letter-slot';
                slot.innerText = '_';
                wordSlotsEl.appendChild(slot);
            }

            spawnBubbleBatch();
        }

        // Spawns bubbles containing the exact next letter + random distraction letters
        function spawnBubbleBatch() {
            bubblesLayer.innerHTML = '';
            activeBubbles = [];

            const targetChar = currentWordObj.word[currentLetterIndex];
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            
            // Generate pool of letters (Ensure target letter is always present)
            let lettersToSpawn = [targetChar];
            while(lettersToSpawn.length < 4) {
                let randomChar = alphabet[Math.floor(Math.random() * alphabet.length)];
                if(!lettersToSpawn.includes(randomChar)) {
                    lettersToSpawn.push(randomChar);
                }
            }

            // Shuffle bubble layout positions horizontally
            lettersToSpawn.sort(() => Math.random() - 0.5);

            lettersToSpawn.forEach((char, index) => {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.innerText = char;
                
                // Position spread across screen width safely
                const posX = 70 + (index * 100) + (Math.random() * 20 - 10);
                const posY = 520 + (Math.random() * 40);
                
                bubble.style.left = posX + 'px';
                bubble.style.top = posY + 'px';
                bubble.style.animationDuration = (3.5 + Math.random() * 1.5) + 's';

                bubble.onclick = () => handleLetterTap(char, bubble);
                bubblesLayer.appendChild(bubble);
            });
        }

        function handleLetterTap(char, bubbleElement) {
            const expectedChar = currentWordObj.word[currentLetterIndex];

            if (char === expectedChar) {
                // Correct Letter!
                playSound('pop');
                bubbleElement.remove();

                const slots = wordSlotsEl.children;
                slots[currentLetterIndex].innerText = char;
                slots[currentLetterIndex].classList.add('filled');

                currentLetterIndex++;

                if (currentLetterIndex >= currentWordObj.word.length) {
                    // Word Completed Successfully!
                    score += 10;
                    scoreEl.innerText = score;
                    playSound('win');
                    showSuccessPopup();
                } else {
                    // Spawn next batch of letters for the next character
                    spawnBubbleBatch();
                }
            } else {
                // Wrong Letter tapped
                playSound('error');
                bubbleElement.style.transform = 'translate(-50%, -50%) scale(0.6)';
                setTimeout(() => {
                    bubbleElement.style.transform = 'translate(-50%, -50%) scale(1)';
                }, 150);
            }
        }

        function showSuccessPopup() {
            modalEmoji.innerText = currentWordObj.emoji;
            modalTitle.innerText = "Fantastic!";
            modalDesc.innerText = `You correctly spelled ${currentWordObj.word}!`;
            successModal.classList.add('show');
        }

        function nextWord() {
            loadNewWord();
        }

        // Initialize first run
        loadNewWord();
    </script>
</body>
</html>

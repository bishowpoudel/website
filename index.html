<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pigeon Panic: The Park Bench Defense</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: linear-gradient(to bottom, #38bdf8 0%, #38bdf8 65%, #22c55e 65%, #15803d 100%);
            border: 4px solid #334155;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            cursor: crosshair;
        }

        /* UI Panel */
        #ui {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        .hud-card {
            background: #1e293b;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #475569;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        /* The Bench & Sandwich in the center */
        #bench-zone {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .bench-seat {
            width: 260px;
            height: 20px;
            background: #9a3412;
            border-radius: 4px;
            box-shadow: 0 4px 0 #7c2d12;
        }

        .bench-legs {
            width: 220px;
            height: 40px;
            display: flex;
            justify-content: space-between;
        }

        .leg {
            width: 15px;
            height: 40px;
            background: #451a03;
        }

        #sandwich {
            position: absolute;
            top: -25px;
            font-size: 32px;
            user-select: none;
            transition: transform 0.1s;
        }

        /* Pigeon Styles */
        .pigeon {
            position: absolute;
            width: 50px;
            height: 40px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }

        .pigeon:active {
            transform: scale(0.7) rotate(20deg);
        }

        /* Feathers / Dust Particle Effect */
        .feather {
            position: absolute;
            width: 6px;
            height: 10px;
            background: #cbd5e1;
            border-radius: 50% 50% 20% 20%;
            pointer-events: none;
            animation: floatAway 0.5s forwards;
            z-index: 50;
        }

        @keyframes floatAway {
            0% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(360deg); }
        }

        /* Game Over Screen */
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            display: none;
        }

        #game-over h1 {
            color: #ef4444;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px #1d4ed8;
            transition: 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 #1d4ed8;
        }

        #instructions {
            margin-top: 10px;
            font-size: 14px;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="hud-card">PIGEONS SHOOED: <span id="score">0</span></div>
        <div class="hud-card">SANDWICH HEALTH: <span id="health">100</span>%</div>
    </div>

    <div id="game-container" id="gameArea">
        <!-- Bench and Central Sandwich -->
        <div id="bench-zone">
            <div id="sandwich">🥪</div>
            <div class="bench-seat"></div>
            <div class="bench-legs">
                <div class="leg"></div>
                <div class="leg"></div>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div id="game-over">
            <h1>THE PIGEONS WON!</h1>
            <p id="final-score" style="margin-bottom: 20px; font-size: 18px; color: #cbd5e1;">Your sandwich was completely devoured.</p>
            <button class="btn" onclick="restartGame()">PROTECT ANOTHER SNACK</button>
        </div>
    </div>

    <div id="instructions">
        Click on the approaching pigeons rapidly to shoo them away before they reach your sandwich!
    </div>

    <script>
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score');
        const healthDisplay = document.getElementById('health');
        const sandwich = document.getElementById('sandwich');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');

        let score = 0;
        let sandwichHealth = 100;
        let isGameOver = false;
        let pigeons = [];
        let spawnTimer = null;
        let gameInterval = null;

        // Web Audio API sound generator
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'shoo') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'peck') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        // Spawn a new pigeon from a random side outside the container view
        function spawnPigeon() {
            if (isGameOver) return;

            const pigeonEl = document.createElement('div');
            pigeonEl.className = 'pigeon';
            
            // SVG Graphic for the pigeon
            pigeonEl.innerHTML = `
                <svg viewBox="0 0 60 50" width="50" height="40">
                    <!-- Body -->
                    <ellipse cx="30" cy="30" rx="18" ry="12" fill="#94a3b8"/>
                    <!-- Head -->
                    <circle cx="42" cy="20" r="8" fill="#64748b"/>
                    <!-- Beak -->
                    <polygon points="48,18 56,20 48,22" fill="#f59e0b"/>
                    <!-- Eye -->
                    <circle cx="44" cy="18" r="1.5" fill="#000"/>
                    <!-- Wing -->
                    <path d="M 20 25 Q 30 15 35 30" fill="#475569"/>
                    <!-- Feet -->
                    <line x1="25" y1="42" x2="22" y2="48" stroke="#f59e0b" stroke-width="2"/>
                    <line x1="35" y1="42" x2="38" y2="48" stroke="#f59e0b" stroke-width="2"/>
                </svg>
            `;

            // Random position along boundaries (left, right, or top)
            const side = Math.floor(Math.random() * 3);
            let startX, startY;

            if (side === 0) { // Left
                startX = -60;
                startY = Math.random() * 350 + 50;
            } else if (side === 1) { // Right
                startX = 820;
                startY = Math.random() * 350 + 50;
            } else { // Top
                startX = Math.random() * 700 + 50;
                startY = -50;
            }

            let pX = startX;
            let pY = startY;

            // Target is the center sandwich zone
            const targetX = 375;
            const targetY = 320;

            const speed = 1.2 + Math.random() * 1.5; // Random speeds

            container.appendChild(pigeonEl);

            const pigeonObj = {
                element: pigeonEl,
                x: pX,
                y: pY,
                update: function() {
                    const dx = targetX - this.x;
                    const dy = targetY - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 40) {
                        // Reached the sandwich! Deal damage
                        sandwichHealth -= 0.5;
                        healthDisplay.innerText = Math.max(0, Math.floor(sandwichHealth));
                        
                        // Shake sandwich animation
                        sandwich.style.transform = `scale(${1 + Math.random() * 0.3}) rotate(${(Math.random() - 0.5) * 20}deg)`;
                        playSound('peck');

                        if (sandwichHealth <= 0) {
                            triggerGameOver();
                        }
                        return false; // Remove pigeon
                    }

                    // Move towards target
                    this.x += (dx / dist) * speed;
                    this.y += (dy / dist) * speed;

                    this.element.style.left = this.x + 'px';
                    this.element.style.top = this.y + 'px';

                    // Face orientation
                    if (dx < 0) {
                        this.element.style.transform = 'scaleX(-1)';
                    } else {
                        this.element.style.transform = 'scaleX(1)';
                    }

                    return true;
                }
            };

            // Click event to shoo pigeon away
            pigeonEl.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                if (isGameOver) return;
                
                playSound('shoo');
                createFeathers(pigeonObj.x, pigeonObj.y);
                pigeonEl.remove();
                
                // Remove from active array
                pigeons = pigeons.filter(p => p !== pigeonObj);

                score++;
                scoreDisplay.innerText = score;
            });

            pigeons.push(pigeonObj);
        }

        // Feather explosion effect on click
        function createFeathers(x, y) {
            for (let i = 0; i < 5; i++) {
                const feather = document.createElement('div');
                feather.className = 'feather';
                feather.style.left = (x + 25) + 'px';
                feather.style.top = (y + 20) + 'px';
                
                const dx = (Math.random() - 0.5) * 100 + 'px';
                const dy = (Math.random() - 0.5) * 100 + 'px';
                feather.style.setProperty('--dx', dx);
                feather.style.setProperty('--dy', dy);

                container.appendChild(feather);
                setTimeout(() => feather.remove(), 500);
            }
        }

        function gameLoop() {
            if (isGameOver) return;
            
            // Update all active pigeons
            pigeons = pigeons.filter(p => p.update());
        }

        function triggerGameOver() {
            isGameOver = true;
            clearInterval(gameInterval);
            clearInterval(spawnTimer);
            pigeons.forEach(p => p.element.remove());
            pigeons = [];

            finalScoreDisplay.innerText = `You managed to shoo away ${score} pigeons before your sandwich fell!`;
            gameOverScreen.style.display = 'flex';
        }

        function restartGame() {
            score = 0;
            sandwichHealth = 100;
            scoreDisplay.innerText = 0;
            healthDisplay.innerText = 100;
            isGameOver = false;
            gameOverScreen.style.display = 'none';

            clearInterval(gameInterval);
            clearInterval(spawnTimer);

            gameInterval = setInterval(gameLoop, 1000 / 60);
            spawnTimer = setInterval(spawnPigeon, 1200); // Spawn new pigeon every 1.2 seconds
        }

        // Start initialization
        restartGame();
    </script>
</body>
</html>

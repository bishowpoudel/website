<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Jumper: The Infinite Bounce</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #09090b;
            color: #fafafa;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 500px;
            height: 650px;
            background: linear-gradient(to bottom, #1e1b4b, #312e81, #3b82f6);
            border: 4px solid #6366f1;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
            overflow: hidden;
        }

        /* UI Head-Up Display */
        #ui {
            display: flex;
            justify-content: space-between;
            width: 500px;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .hud-item {
            background: #18181b;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #3f3f46;
        }

        /* The Player (Bouncy Star) */
        #player {
            position: absolute;
            width: 32px;
            height: 32px;
            font-size: 30px;
            line-height: 32px;
            text-align: center;
            user-select: none;
            z-index: 10;
        }

        /* Cloud Platforms */
        .cloud {
            position: absolute;
            width: 80px;
            height: 16px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 5;
        }

        /* Danger Storm Clouds */
        .storm-cloud {
            position: absolute;
            width: 80px;
            height: 16px;
            background: #ef4444;
            border-radius: 10px;
            box-shadow: 0 0 10px #ef4444;
            z-index: 5;
        }

        /* Jump Dust Effect Particle */
        .dust {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            animation: riseFade 0.4s forwards;
            z-index: 4;
        }

        @keyframes riseFade {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(15px) scale(0.2); }
        }

        /* Game Over Screen */
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 9, 11, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            display: none;
        }

        #game-over h1 {
            color: #ef4444;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px #4338ca;
            transition: 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 #4338ca;
        }

        #instructions {
            margin-top: 10px;
            font-size: 13px;
            color: #a1a1aa;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="hud-item">HEIGHT: <span id="score">0</span>m</div>
        <div class="hud-item">HIGH SCORE: <span id="highscore">0</span></div>
    </div>

    <div id="game-container">
        <div id="player">⭐</div>

        <!-- Game Over Modal -->
        <div id="game-over">
            <h1>FELL INTO THE ABYSS!</h1>
            <p id="final-score" style="margin-bottom: 20px; font-size: 16px; color: #d4d4d8;">You reached 0 meters.</p>
            <button class="btn" onclick="restartGame()">JUMP AGAIN</button>
        </div>
    </div>

    <div id="instructions">
        Use <b>A / D</b> or <b>Left / Right Arrow Keys</b> to steer your star. Bounce on white clouds! Avoid red storm clouds!
    </div>

    <script>
        const container = document.getElementById('game-container');
        const playerEl = document.getElementById('player');
        const scoreDisplay = document.getElementById('score');
        const highscoreDisplay = document.getElementById('highscore');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');

        let score = 0;
        let highscore = 0;
        let isGameOver = false;

        // Player Physics variables
        let playerX = 234;
        let playerY = 450;
        let playerVelX = 0;
        let playerVelY = 0;
        const gravity = 0.35;
        const jumpForce = -10.5;

        // Controls state
        let moveLeft = false;
        let moveRight = false;

        // Platforms array
        let platforms = [];
        let cameraOffsetY = 0;
        let maxReachedHeight = 0;

        // Web Audio API Sound Generator
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // Handle Keyboard Events
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') moveRight = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') moveRight = false;
        });

        // Initialize Platforms layout
        function initPlatforms() {
            platforms.forEach(p => p.element.remove());
            platforms = [];

            // Starting safe platform underneath the player
            createPlatform(210, 500, false);

            // Generate upper platforms
            for (let y = 420; y > -2000; y -= 75) {
                let x = Math.random() * 420;
                let isStorm = Math.random() < 0.22 && y < 100; // 22% chance of storm cloud higher up
                createPlatform(x, y, isStorm);
            }
        }

        function createPlatform(x, y, isStorm) {
            const el = document.createElement('div');
            el.className = isStorm ? 'storm-cloud' : 'cloud';
            container.appendChild(el);

            platforms.push({
                x: x,
                y: y,
                isStorm: isStorm,
                element: el
            });
        }

        function createDust(x, y) {
            for (let i = 0; i < 3; i++) {
                const dust = document.createElement('div');
                dust.className = 'dust';
                dust.style.left = (x + Math.random() * 24) + 'px';
                dust.style.top = (y + 28) + 'px';
                container.appendChild(dust);
                setTimeout(() => dust.remove(), 400);
            }
        }

        // Main game loop running at 60 FPS
        function gameLoop() {
            if (isGameOver) return;

            // Horizontal steering
            if (moveLeft) playerVelX = -4.5;
            else if (moveRight) playerVelX = 4.5;
            else playerVelX *= 0.8; // Friction deceleration

            playerX += playerVelX;

            // Screen wrapping horizontally (wrap around sides)
            if (playerX < -32) playerX = 500;
            if (playerX > 500) playerX = -32;

            // Apply gravity vertically
            playerVelY += gravity;
            playerY += playerVelY;

            // Camera tracking: If player jumps past the middle point, scroll the world down!
            if (playerY < 300) {
                let diff = 300 - playerY;
                playerY = 300;
                cameraOffsetY += diff;

                // Shift all platforms downward
                platforms.forEach(p => {
                    p.y += diff;
                });

                // Generate new platforms at the top as you scale higher
                let highestPlatformY = Math.min(...platforms.map(p => p.y));
                if (highestPlatformY > -50) {
                    createPlatform(Math.random() * 420, highestPlatformY - 75, Math.random() < 0.28);
                }

                // Update height score
                maxReachedHeight += Math.floor(diff);
                score = Math.floor(maxReachedHeight / 10);
                scoreDisplay.innerText = score;
            }

            // Platform collision detection (only bounce when falling downwards)
            if (playerVelY > 0) {
                platforms.forEach(p => {
                    // Check bounding boxes
                    if (
                        playerX + 24 > p.x &&
                        playerX < p.x + 80 &&
                        playerY + 32 >= p.y &&
                        playerY + 32 <= p.y + 16
                    ) {
                        if (p.isStorm) {
                            // Red cloud penalty / bounce down
                            playSound('hit');
                            playerVelY = -6;
                        } else {
                            // Normal cloud jump bounce
                            playSound('jump');
                            playerVelY = jumpForce;
                            createDust(playerX, playerY);
                        }
                    }
                });
            }

            // Clean up platforms that fall off the bottom of the screen
            platforms.forEach(p => {
                if (p.y > 680) {
                    p.element.remove();
                }
            });
            platforms = platforms.filter(p => p.y <= 680);

            // Check Game Over (Fell below the bottom boundary)
            if (playerY > 660) {
                triggerGameOver();
            }

            // Render positions on screen
            playerEl.style.left = playerX + 'px';
            playerEl.style.top = playerY + 'px';

            platforms.forEach(p => {
                p.element.style.left = p.x + 'px';
                p.element.style.top = p.y + 'px';
            });
        }

        function triggerGameOver() {
            isGameOver = true;
            clearInterval(gameInterval);

            if (score > highscore) {
                highscore = score;
                highscoreDisplay.innerText = highscore;
            }

            finalScoreDisplay.innerText = `You reached a height of ${score} meters!`;
            gameOverScreen.style.display = 'flex';
        }

        function restartGame() {
            isGameOver = false;
            score = 0;
            maxReachedHeight = 0;
            scoreDisplay.innerText = 0;
            playerX = 234;
            playerY = 400;
            playerVelX = 0;
            playerVelY = -8;
            cameraOffsetY = 0;
            gameOverScreen.style.display = 'none';

            initPlatforms();
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 1000 / 60);
        }

        // Initialize game start
        let gameInterval = null;
        restartGame();
    </script>
</body>
</html>
